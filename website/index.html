<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#00b578" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#1c1c1e" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="肌肉会飞 - 科学训练计划与饮食记录，让肌肉飞起来" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" href="favicon-32.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <title>肌肉会飞</title>
  <script>
    // 防止深色模式闪烁：在 CSS 加载前就应用主题
    (function() {
      try {
        var t = JSON.parse(localStorage.getItem('ql_theme')) || 'auto';
        var dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch(e) { document.documentElement.dataset.theme = 'light'; }
    })();
  </script>
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <noscript>
    <div style="padding:32px 20px;text-align:center;font-family:sans-serif">
      <h2 style="margin-bottom:12px">肌肉会飞</h2>
      <p>本应用需要启用 JavaScript 才能运行，请在浏览器设置中开启后刷新页面。</p>
    </div>
  </noscript>
  <div id="loginGate" class="login-gate">
    <div class="lg-inner">
      <div class="lg-brand">
        <img class="lg-logo" src="icon-512.png" alt="肌肉会飞图标" width="76" height="76" />
        <h1>肌肉会飞</h1>
        <p>让肌肉飞起来 · 登录后开始使用</p>
      </div>
      <form class="lg-form" id="gateForm" autocomplete="on">
        <div class="lg-field">
          <label for="gateUser" class="lg-label">用户名</label>
          <input id="gateUser" name="username" placeholder="3-20位字母/数字/下划线"
            autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false"
            enterkeyhint="next" maxlength="20" />
          <p class="field-msg" id="gateUserMsg" aria-live="polite"></p>
        </div>
        <div class="lg-field">
          <label for="gatePass" class="lg-label">密码</label>
          <input id="gatePass" name="password" type="password" placeholder="至少 6 位"
            autocomplete="current-password" enterkeyhint="go" maxlength="40" />
          <p class="field-msg" id="gatePassMsg" aria-live="polite"></p>
        </div>
        <p class="lg-error" id="gateError" role="alert" hidden></p>
        <div class="lg-btns">
          <button type="submit" id="gateLoginBtn" class="lg-primary">登录</button>
          <button type="button" id="gateRegBtn" class="lg-secondary">注册</button>
        </div>
        <p class="lg-note">注册后数据可云同步，换设备登录同一账号即可恢复全部记录</p>
      </form>
    </div>
  </div>
  <div id="app"></div>
  <nav id="tabbar" aria-label="主导航">
    <a data-tab="home" class="active"><span class="ticon">🏠</span><span>首页</span></a>
    <a data-tab="plan"><span class="ticon">🏋️</span><span>训练</span></a>
    <a data-tab="stats"><span class="ticon">📊</span><span>记录</span></a>
    <a data-tab="mine"><span class="ticon">👤</span><span>我的</span></a>
  </nav>
  <div id="toast"></div>
  <script src="app.js"></script>
  <script src="running-module.js"></script>
  <script src="diet-module.js"></script>
  <script src="training-plans.js"></script>
  <script src="rewards-module.js"></script>
  <script src="body-module.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
