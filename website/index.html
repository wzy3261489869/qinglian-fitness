<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#00b578" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#1c1c1e" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="肌肉会飞 - 科学训练计划与饮食记录，让肌肉飞起来" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" href="favicon-32.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <title>肌肉会飞</title>
  <script>
    // 防止深色模式闪烁：在 CSS 加载前就应用主题
    (function() {
      try {
        var t = JSON.parse(localStorage.getItem('ql_theme')) || 'auto';
        var dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch(e) { document.documentElement.dataset.theme = 'light'; }
    })();
  </script>
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <noscript>
    <div style="padding:32px 20px;text-align:center;font-family:sans-serif">
      <h2 style="margin-bottom:12px">肌肉会飞</h2>
      <p>本应用需要启用 JavaScript 才能运行，请在浏览器设置中开启后刷新页面。</p>
    </div>
  </noscript>
  <div id="loginGate" class="login-gate">
    <div class="lg-inner">
      <div class="lg-brand">
        <img class="lg-logo" src="icon-512.png" alt="肌肉会飞图标" width="76" height="76" />
        <h1>肌肉会飞</h1>
        <p>让肌肉飞起来 · 登录后开始使用</p>
      </div>
      <form class="lg-form" id="gateForm" autocomplete="on">
        <div class="lg-field">
          <label for="gateUser" class="lg-label">用户名</label>
          <input id="gateUser" name="username" placeholder="3-20位字母/数字/下划线"
            autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false"
            enterkeyhint="next" maxlength="20" />
          <p class="field-msg" id="gateUserMsg" aria-live="polite"></p>
        </div>
        <div class="lg-field">
          <label for="gatePass" class="lg-label">密码</label>
          <input id="gatePass" name="password" type="password" placeholder="至少 6 位"
            autocomplete="current-password" enterkeyhint="go" maxlength="40" />
          <p class="field-msg" id="gatePassMsg" aria-live="polite"></p>
        </div>
        <div class="lg-field">
          <span class="lg-label">性别</span>
          <div class="lg-gender" id="gateGender">
            <button type="button" class="lg-g-i" data-g="男">
              <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#165dff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9.5" cy="14" r="4.5"/><path d="M12.7 10.8 19 5"/><path d="M14 5h5v5"/></svg>
              <b>男</b>
            </button>
            <button type="button" class="lg-g-i" data-g="女">
              <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#ec4899" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.5" r="4.5"/><path d="M12 13v6.5"/><path d="M8.5 16.5h7"/></svg>
              <b>女</b>
            </button>
          </div>
        </div>
        <p class="lg-error" id="gateError" role="alert" hidden></p>
        <div class="lg-btns">
          <button type="submit" id="gateLoginBtn" class="lg-primary">登录</button>
          <button type="button" id="gateRegBtn" class="lg-secondary">注册</button>
        </div>
        <p class="lg-note">注册后数据可云同步，换设备登录同一账号即可恢复全部记录</p>
      </form>
    </div>
  </div>
  <div id="app"></div>
  <nav id="tabbar" aria-label="主导航">
    <a data-tab="home" class="active"><span class="ticon"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 10.4 12 3.8l8.5 6.6"/><path d="M5.6 9.4v9.2a1.4 1.4 0 0 0 1.4 1.4h10a1.4 1.4 0 0 0 1.4-1.4V9.4"/><path class="ti-accent" d="M9.8 20v-5.4a1.2 1.2 0 0 1 1.2-1.2h2a1.2 1.2 0 0 1 1.2 1.2V20"/></svg></span><span>首页</span></a>
    <a data-tab="plan"><span class="ticon"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6.2 7.2v9.6M17.8 7.2v9.6M3.4 9.2v5.6M20.6 9.2v5.6M6.2 12h11.6"/></svg></span><span>训练</span></a>
    <a data-tab="stats"><span class="ticon"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16"/><path class="ti-accent" d="M7 16.5v-4M12 16.5V7.5M17 16.5v-6"/></svg></span><span>记录</span></a>
    <a data-tab="mine"><span class="ticon"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.2" r="3.4"/><path class="ti-accent" d="M5.2 19.6c.9-3.1 3.6-4.9 6.8-4.9s5.9 1.8 6.8 4.9"/></svg></span><span>我的</span></a>
  </nav>
  <div id="toast"></div>
  <script src="app.js"></script>
  <script src="running-module.js"></script>
  <script src="diet-module.js"></script>
  <script src="training-plans.js"></script>
  <script src="rewards-module.js"></script>
  <script src="body-module.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
